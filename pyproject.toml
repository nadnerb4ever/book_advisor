[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "book-advisor"
version = "0.0.0"
description = "Personalized book recommendations from reading history and reviews."
readme = "README.md"
requires-python = ">=3.14.3,<3.15"

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["src/goodreads/tests"]
pythonpath = ["src"]
